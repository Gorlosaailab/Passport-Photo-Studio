<link  href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport Photo Studio</title>
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Passport Photo Studio</h1>
    </header>

    <div class="editor">
        <input type="file" id="upload" accept="image/*">
        <div class="preview-box">
            <img id="image" src="" alt="Upload Image">
        </div>
        <input type="range" id="zoom" min="0.5" max="3" step="0.1" value="1">
        <button id="generateBtn">Generate Sheet</button>
    </div>

    <section id="sheet"></section>

    <!-- Cropper.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
